<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="header">
      <div class="logo">🛡️</div>
      <div>
        <div class="brand">КиберЩит</div>
        <div class="version">v4.4</div>
      </div>
      <div style="display:flex; gap:6px; margin-left:auto;">
  <button class="dashboard-btn" id="openScannerBtn" title="Сканер безопасности" style="margin-left:0;">🔍</button>
  <button class="dashboard-btn" id="openDashboardBtn" title="Дашборд" style="margin-left:0;">📊</button>
</div>
    </div>

    <!-- Статус -->
    <div class="status-card" id="statusCard">
      <div class="status-icon" id="statusIcon">?</div>
      <div class="status-content">
        <div class="status-title" id="statusTitle">Проверка...</div>
        <div class="status-domain" id="statusDomain">—</div>
        <div class="status-reasons" id="statusReasons"></div>
      </div>
    </div>

    <!-- Трекеры -->
    <div class="section tracker-section" id="trackerSection" style="display:none;">
      <div class="section-title">
        <span>🚫 Трекеров заблокировано</span>
        <span class="tracker-badge" id="trackerCount">0</span>
      </div>
      <div class="tracker-list" id="trackerList"></div>
    </div>

    <!-- Cookies -->
    <div class="section" id="cookiesSection" style="display:none;">
      <div class="section-title">
        <span>🍪 Cookies на сайте</span>
        <button class="link-btn" id="deleteCookiesBtn">Удалить все</button>
      </div>
      <div class="cookie-stats" id="cookieStats"></div>
      <div class="cookie-list" id="cookieList"></div>
    </div>

    <!-- SSL -->
    <div class="section" id="sslSection" style="display:none;">
      <div class="section-title">
        <span>🔒 SSL-сертификат</span>
        <span class="ssl-badge" id="sslBadge">—</span>
      </div>
      <div class="ssl-info" id="sslInfo"></div>
    </div>

    <!-- О сайте -->
    <div class="section" id="siteCardSection" style="display:none;">
      <div class="section-title"><span>🔎 О сайте</span></div>
      <div class="site-info" id="siteInfo"></div>
    </div>

    <!-- Год создания -->
    <div class="section" id="creationSection" style="display:none;">
      <div class="section-title"><span>📅 Год создания</span></div>
      <div class="creation-info">
        <div class="creation-year" id="creationYear">—</div>
        <div class="creation-age" id="creationAge"></div>
      </div>
    </div>

    <!-- Email -->
    <div class="section">
      <div class="section-title"><span>📧 Проверка email</span></div>
      <div class="email-box">
        <input type="email" id="emailInput" placeholder="your@email.com">
        <button id="checkEmailBtn" title="Проверить">🔍</button>
      </div>
      <div class="email-result" id="emailResult"></div>
    </div>

    <!-- Генератор паролей -->
    <div class="section">
      <div class="section-title"><span>🔑 Генератор паролей</span></div>
      <div class="password-box">
        <input type="text" id="generatedPassword" readonly value="Нажмите «Сгенерировать»">
        <button id="copyBtn" title="Копировать">📋</button>
      </div>
      <div class="password-options">
        <label>Длина: <input type="number" id="passLength" min="8" max="64" value="16"></label>
      </div>
      <div class="password-checks">
        <label><input type="checkbox" id="useUpper" checked> A-Z</label>
        <label><input type="checkbox" id="useLower" checked> a-z</label>
        <label><input type="checkbox" id="useDigits" checked> 0-9</label>
        <label><input type="checkbox" id="useSymbols" checked> !@#</label>
      </div>
      <button class="btn btn-primary" id="generateBtn">Сгенерировать</button>
    </div>

 <div class="menu">
        <button data-page="home">🏠 Главная</button>
        <button data-page="methods">🛡️ Методики</button>
        <button data-page="software">📦 Программы</button>
        <button data-page="forum">💬 Форум</button>
        <button data-page="schedule">📅 Расписание</button>
        <button data-page="profile">👤 Кабинет</button>
      </div>
      
    <!-- История -->
    <div class="section">
      <div class="section-title">
        <span>📜 История проверок</span>
        <button class="link-btn" id="clearHistoryBtn">Очистить</button>
      </div>
      <div class="history" id="historyList">
        <div class="empty">История пуста</div>
      </div>
    </div>

    <button class="btn btn-sync" id="syncBtn">🔄 Синхронизировать с сайтом</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
